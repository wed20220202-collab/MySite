<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#4a1118">
  <title>千駄木ちゃんこ祭り マイクーポン</title>
  <style>
    :root{color-scheme:light;--deep:#4a1118;--red:#8f1f28;--ink:#2d2520;--line:#eadbc2}
    *{box-sizing:border-box}[hidden]{display:none!important}
    html,body{width:100%;height:100%;margin:0;background:#f8ead0;color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}
    body{display:flex;flex-direction:column;min-height:100dvh}
    button,a{font:inherit}button{cursor:pointer}
    .bar{z-index:1;flex:none;background:#fffaf0;border-bottom:1px solid var(--line);box-shadow:0 3px 18px #4a111814;padding:10px max(14px,env(safe-area-inset-left))}
    .bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:auto}
    .brand{color:var(--deep);font-family:serif;font-size:clamp(17px,4vw,22px);font-weight:900;line-height:1.3}
    .nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .pill{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:7px 13px;border:1px solid #d7bcb2;border-radius:999px;background:#fff;color:var(--deep);font-size:13px;font-weight:800;text-decoration:none}
    .pill.primary{border-color:var(--red);background:var(--red);color:#fff}
    .bar-note{max-width:1100px;margin:6px auto 0;font-size:12px;color:#665a51;line-height:1.5}
    .saved{border-bottom:1px solid var(--line);background:#fffaf0;padding:12px 16px;max-height:45dvh;overflow:auto}
    .saved-inner{max-width:1100px;margin:auto}
    .saved h2{font-size:16px;color:var(--deep);margin:0 0 8px}
    .saved-list{display:grid;gap:8px}
    .saved-row{display:flex;align-items:center;gap:8px}
    .saved-select{flex:1;min-width:0;padding:10px 13px;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
    .saved-select[aria-current="true"]{border-color:var(--red);background:#fff0e5;font-weight:800}
    .saved-delete{padding:10px 12px;border:1px solid #dbb8b8;border-radius:12px;background:#fff;color:#8f1f28;font-weight:800}
    .saved-time{display:block;color:#756b63;font-size:12px;font-weight:400;margin-top:2px}
    .saved-help{font-size:12px;color:#665a51;line-height:1.6;margin:9px 0 0}
    #couponApp{display:block;flex:1;min-height:0;width:100%;border:0}
    @media(max-width:620px){.bar-top{align-items:flex-start;flex-direction:column}.nav{justify-content:flex-start}.bar-note{margin-top:8px}}
  </style>
</head>
<body>
  <header class="bar">
    <div class="bar-top">
      <div class="brand">千駄木ちゃんこ祭り｜マイクーポン</div>
      <nav class="nav" aria-label="クーポンメニュー">
        <button id="savedToggle" class="pill" type="button" aria-expanded="false" aria-controls="savedPanel">保存したクーポン <span id="savedCount">(0)</span></button>
        <button id="copyLink" class="pill" type="button" hidden>この券のURLをコピー</button>
        <a class="pill primary" href="stores.html" target="_blank" rel="noopener noreferrer">利用できる店舗を見る</a>
      </nav>
    </div>
    <p id="storageStatus" class="bar-note" role="status" aria-live="polite">この端末にクーポンを保存します。別の端末や、ブラウザのデータを消した後には引き継がれません。</p>
  </header>
  <section id="savedPanel" class="saved" hidden aria-label="この端末に保存したクーポン">
    <div class="saved-inner">
      <h2>この端末に保存したクーポン</h2>
      <div id="savedList" class="saved-list"></div>
      <p class="saved-help">削除はこの端末の保存情報だけを消します。発行済みのクーポン自体は無効になりません。利用可否は表示時に最新の状態を確認します。</p>
    </div>
  </section>
  <iframe id="couponApp" title="千駄木ちゃんこ祭り マイクーポン" referrerpolicy="no-referrer"></iframe>
  <script>
    const appBase='https://script.google.com/macros/s/AKfycbwphXfMQiKax7jESt6mOww5AAK4xDofqRDEA5sMaim84OQXj_QDAtilHOMo7sIymP_9/exec?page=coupon_wallet&authuser=0';
    const storageKey='sendagi-chanko-coupons-v1';
    const $=id=>document.getElementById(id);
    const isToken=value=>/^[a-f0-9]{64}$/i.test(String(value||''));
    let storageAvailable=true;
    let saved=[];
    let current='';

    function normalizeSaved(value){
      if(!Array.isArray(value))return [];
      const seen=new Set();
      return value.filter(item=>{
        if(!item||!isToken(item.token))return false;
        const token=item.token.toLowerCase();
        if(seen.has(token))return false;
        seen.add(token);return true;
      }).map(item=>{
        const savedAt=Number(item.savedAt);
        return {token:item.token.toLowerCase(),savedAt:Number.isFinite(savedAt)&&savedAt>0?savedAt:Date.now()};
      });
    }
    try{
      const testKey=storageKey+'-test';
      localStorage.setItem(testKey,'1');localStorage.removeItem(testKey);
    }catch(error){storageAvailable=false}
    if(storageAvailable){
      try{saved=normalizeSaved(JSON.parse(localStorage.getItem(storageKey)||'[]'))}catch(error){}
    }

    const requested=new URLSearchParams(location.search).get('c');
    if(requested&&isToken(requested)){
      current=requested.toLowerCase();
      if(storageAvailable&&!saved.some(item=>item.token===current)){
        saved.unshift({token:current,savedAt:Date.now()});
        try{persist()}catch(error){storageAvailable=false;saved=[]}
      }
    }else if(requested){
      $('storageStatus').textContent='クーポンURLが無効です。QRコードを読み取り直すか、「保存したクーポン」から選んでください。';
    }else if(saved.length){
      current=saved[0].token;
      setUrl(current);
    }

    if(!storageAvailable){
      $('storageStatus').textContent='このブラウザでは自動保存できません。クーポンURLをブックマークするか、表示されたQRをスクリーンショットで保存してください。';
    }
    showCurrent();renderSaved();

    $('savedToggle').addEventListener('click',()=>{
      const open=$('savedPanel').hidden;
      $('savedPanel').hidden=!open;
      $('savedToggle').setAttribute('aria-expanded',String(open));
    });
    $('copyLink').addEventListener('click',async()=>{
      if(!current)return;
      const url=new URL(location.href);url.searchParams.set('c',current);
      try{await navigator.clipboard.writeText(url.href);$('storageStatus').textContent='クーポンURLをコピーしました。失くさないよう保存してください。'}
      catch(error){$('storageStatus').textContent='コピーできませんでした。ブラウザのアドレスバーからクーポンURLを保存してください。'}
    });
    window.addEventListener('storage',event=>{
      if(event.key!==storageKey||!storageAvailable)return;
      try{
        saved=normalizeSaved(JSON.parse(event.newValue||'[]'));
        renderSaved();
      }catch(error){}
    });

    function persist(){localStorage.setItem(storageKey,JSON.stringify(saved))}
    function setUrl(token){const url=new URL(location.href);if(token)url.searchParams.set('c',token);else url.searchParams.delete('c');history.replaceState(null,'',url)}
    function showCurrent(){
      $('couponApp').src=appBase+(current?'&coupon='+encodeURIComponent(current):'');
      $('copyLink').hidden=!current;
    }
    function renderSaved(){
      $('savedCount').textContent='('+saved.length+')';
      const list=$('savedList');list.replaceChildren();
      if(!saved.length){const message=document.createElement('p');message.textContent=storageAvailable?'保存されたクーポンはありません。購入時のQRを読み取ると、ここに追加されます。':'自動保存を利用できません。';list.append(message);return}
      saved.forEach((item,index)=>{
        const row=document.createElement('div');row.className='saved-row';
        const select=document.createElement('button');select.type='button';select.className='saved-select';select.setAttribute('aria-current',String(item.token===current));
        select.textContent='クーポン '+(index+1)+(item.token===current?'（表示中）':'');
        const time=document.createElement('span');time.className='saved-time';time.textContent='保存：'+new Date(item.savedAt).toLocaleString('ja-JP');select.append(time);
        select.addEventListener('click',()=>{current=item.token;setUrl(current);showCurrent();renderSaved();$('savedPanel').hidden=true;$('savedToggle').setAttribute('aria-expanded','false')});
        const remove=document.createElement('button');remove.type='button';remove.className='saved-delete';remove.textContent='削除';remove.setAttribute('aria-label','クーポン '+(index+1)+'をこの端末から削除');
        remove.addEventListener('click',()=>{
          if(!confirm('この端末の保存情報を削除しますか？クーポン自体は無効になりません。'))return;
          const next=saved.filter(entry=>entry.token!==item.token);
          try{localStorage.setItem(storageKey,JSON.stringify(next));saved=next}
          catch(error){$('storageStatus').textContent='保存情報を削除できませんでした。ブラウザの設定をご確認ください。';return}
          if(current===item.token){current=saved[0]?.token||'';setUrl(current);showCurrent()}
          renderSaved();
        });
        row.append(select,remove);list.append(row);
      });
    }
  </script>
</body>
</html>
