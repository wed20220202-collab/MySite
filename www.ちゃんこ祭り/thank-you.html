<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#65121b">
  <meta name="robots" content="noindex,nofollow">
  <title>ご回答ありがとうございました｜千駄木ちゃんこ祭り</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="gift-page">
  <main class="gift-shell">
    <section class="gift-card">
      <div class="thank-you__icon" aria-hidden="true">✓</div>
      <p class="gift-card__eyebrow">千駄木ちゃんこ祭り</p>
      <h1 id="result-title">ご回答ありがとうございました！</h1>
      <p id="result-message" class="gift-card__message">いただいたご意見は、今後のお祭りの参考にさせていただきます。</p>

      <div class="gift-divider" aria-hidden="true"><span>お礼のプレゼント</span></div>

      <h2>ちゃんこ祭り オリジナル壁紙</h2>
      <p class="gift-description">アンケートにご協力いただいた方へ、スマートフォン用の壁紙を1枚プレゼントします。</p>

      <figure class="wallpaper-preview">
        <img src="assets/chanko-wallpaper.png" alt="秋の夜に湯気を立てるちゃんこ鍋のオリジナル壁紙">
      </figure>

      <a class="download-button" href="assets/chanko-wallpaper.png" download="sendagi-chanko-wallpaper.png">壁紙を保存する</a>
      <p class="save-help">保存できない場合は、画像を長押しして「写真に保存」を選んでください。</p>
    </section>
  </main>

  <footer>
    <p>千駄木二丁目商店街振興組合</p>
    <p>千駄木ちゃんこ祭り</p>
  </footer>

  <script src="thank-you.js"></script>
</body>
</html>
