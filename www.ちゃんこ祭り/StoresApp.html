<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root{color-scheme:light;--deep:#4a1118;--red:#8f1f28;--ink:#2d2520;--muted:#756b63;--line:#eadbc2}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f7e4c2,#fffdf8 55%,#f4e4c8);color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}
    .shell{width:min(1000px,100%);margin:auto;padding:24px 16px 48px}
    .eyebrow{color:var(--red);font-size:13px;font-weight:900;letter-spacing:.12em}
    h1{font-family:serif;color:var(--deep);font-size:clamp(28px,7vw,44px);margin:7px 0 6px}
    .lead{line-height:1.7;color:var(--muted);margin:0 0 18px}
    .topline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .back{display:inline-block;border:1px solid #d7bcb2;border-radius:999px;padding:9px 15px;background:white;color:var(--deep);font-size:14px;font-weight:800;text-decoration:none}
    .surface{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 36px #4a11181a;overflow:hidden}
    #map{display:block;height:clamp(320px,52vh,560px);width:100%;border:0;background:#eee8d8}
    .map-help{padding:12px 18px;margin:0;background:#fff5e8;color:#665a51;font-size:13px;line-height:1.6}
    .map-help a{color:var(--deep);font-weight:800}
    .list-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:20px 20px 10px}
    h2{font-family:serif;color:var(--deep);font-size:23px;margin:0}
    #count{color:var(--muted);font-size:13px}
    #status{padding:0 20px;color:var(--muted);line-height:1.6}
    .store-list{list-style:none;margin:0;padding:0 20px 20px;display:grid;gap:10px}
    .store{border:1px solid var(--line);background:#fffaf3;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px}
    .store h3{font-size:17px;color:var(--deep);margin:0 0 4px}
    .store p{font-size:14px;line-height:1.5;color:#665a51;margin:0}
    .show-map{display:inline-block;white-space:nowrap;border-radius:999px;background:var(--red);color:white;font-size:13px;font-weight:800;padding:9px 13px;text-decoration:none}
    .show-map:focus-visible,.map-help a:focus-visible{outline:3px solid #a65823;outline-offset:3px}
    .small{font-size:12px;color:var(--muted);line-height:1.6;margin:16px 2px 0}
    @media(max-width:600px){.shell{padding:18px 10px 38px}.store{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="topline">
      <div><div class="eyebrow">千駄木二丁目商店街</div><h1>クーポン利用店舗</h1></div>
      <a class="back" href="https://wed20220202-collab.github.io/MySite/www.%E3%81%A1%E3%82%83%E3%82%93%E3%81%93%E7%A5%AD%E3%82%8A/coupon.html">マイクーポンへ</a>
    </div>
    <p class="lead">登録済みの加盟店を地図と一覧でご覧いただけます。店舗の情報は主催者の登録内容に基づきます。</p>
    <section class="surface" aria-label="クーポン利用店舗の地図と一覧">
      <iframe id="map" title="Google マイマップ：クーポン利用店舗の地図" src="https://www.google.com/maps/d/u/1/embed?mid=1VRGJlNsc7GQERvx5ZE8SP0AOC0gEhL8&amp;ehbc=2E312F" loading="lazy" allowfullscreen></iframe>
      <p class="map-help">地図が表示されない場合は <a href="https://www.google.com/maps/d/viewer?mid=1VRGJlNsc7GQERvx5ZE8SP0AOC0gEhL8" target="_blank" rel="noopener noreferrer">Google マイマップで開く（新しいタブ）</a>。地図のピンは手動で更新するため、最新の利用可能店舗は下の一覧をご確認ください。</p>
      <div class="list-head"><h2>利用できる店舗</h2><span id="count"></span></div>
      <p id="status" role="status" aria-live="polite">店舗情報を読み込んでいます…</p>
      <ul id="storeList" class="store-list"></ul>
    </section>
    <p class="small">営業時間や利用条件は会計時に店舗へご確認ください。</p>
  </main>
  <script>
    const $=id=>document.getElementById(id);

    google.script.run.withSuccessHandler(renderStores).withFailureHandler(error=>{
      $('status').textContent='店舗情報を読み込めませんでした。時間をおいて再度お試しください。';
    }).getPublicStores();

    function renderStores(response){
      const rows=Array.isArray(response)?response:[];
      const stores=rows.filter(item=>item&&String(item.name||'').trim())
        .map(item=>({
          name:String(item.name||'').trim(),
          address:String(item.address||'').trim(),
          lat:item.lat===''||item.lat==null?NaN:Number(item.lat),
          lng:item.lng===''||item.lng==null?NaN:Number(item.lng)
        }));
      $('count').textContent=stores.length+'店舗';
      $('status').textContent=stores.length?'各店舗の「Google マップで見る」から所在地を確認できます。':'現在、利用店舗の登録情報はありません。';
      const list=$('storeList');list.replaceChildren();
      stores.forEach(store=>{
        const hasCoordinates=Number.isFinite(store.lat)&&Number.isFinite(store.lng)&&Math.abs(store.lat)<=90&&Math.abs(store.lng)<=180;
        const item=document.createElement('li');item.className='store';
        const details=document.createElement('div');
        const title=document.createElement('h3');title.textContent=store.name;
        const address=document.createElement('p');address.textContent=store.address||'住所は未登録です。';
        details.append(title,address);item.append(details);
        if(hasCoordinates){
          const link=document.createElement('a');link.className='show-map';link.textContent='Google マップで見る';
          link.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(store.lat+','+store.lng);
          link.target='_blank';link.rel='noopener noreferrer';
          link.setAttribute('aria-label',store.name+'をGoogle マップで見る（新しいタブ）');
          item.append(link);
        }
        list.append(item);
      });
    }
  </script>
</body>
</html>
