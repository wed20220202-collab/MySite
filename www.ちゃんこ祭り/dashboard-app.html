<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light; --red:#8f1f28; --deep:#4a1118; --gold:#d5a947; --cream:#fff9eb; --ink:#2d2520; --muted:#756b63; --line:#eadbc2; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif; color:var(--ink); background:radial-gradient(circle at 12% 0%,#fff3c9,transparent 30%),linear-gradient(135deg,#f8ead0,#fffdf8 52%,#f3e2c3); }
    button,input { font:inherit; }
    .hidden { display:none !important; }
    .login-shell { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .login-card { width:min(440px,100%); padding:34px; border:1px solid rgba(143,31,40,.18); border-radius:24px; background:rgba(255,253,248,.94); box-shadow:0 24px 70px rgba(74,17,24,.15); }
    .crest { width:58px; height:58px; margin:0 auto 16px; display:grid; place-items:center; border-radius:50%; color:#fff; background:linear-gradient(145deg,var(--red),var(--deep)); box-shadow:0 8px 22px rgba(143,31,40,.25); font-size:27px; }
    h1,h2,p { margin-top:0; }
    .login-card h1 { margin-bottom:8px; text-align:center; font-family:serif; font-size:28px; }
    .login-card>p { color:var(--muted); text-align:center; }
    label { display:block; margin:18px 0 7px; font-weight:700; }
    input { width:100%; padding:13px 14px; border:1px solid #d9c7aa; border-radius:12px; background:#fff; }
    input:focus { outline:3px solid rgba(213,169,71,.28); border-color:var(--gold); }
    .primary { width:100%; margin-top:22px; padding:14px; border:0; border-radius:12px; color:#fff; background:linear-gradient(135deg,var(--red),#b52d37); font-weight:800; cursor:pointer; }
    .primary:disabled { opacity:.65; cursor:wait; }
    .error { min-height:24px; margin:14px 0 0; color:#b00020; text-align:center; font-weight:700; }
    .dashboard { min-height:100vh; }
    .topbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:16px clamp(18px,4vw,52px); color:#fff; background:linear-gradient(110deg,var(--deep),var(--red)); box-shadow:0 8px 24px rgba(74,17,24,.2); }
    .topbar h1 { margin:0; font-family:serif; font-size:clamp(20px,3vw,31px); }
    .live { display:inline-flex; align-items:center; gap:8px; margin-top:5px; font-size:13px; opacity:.9; }
    .live::before { content:""; width:9px; height:9px; border-radius:50%; background:#77e69a; box-shadow:0 0 0 5px rgba(119,230,154,.18); animation:pulse 1.5s infinite; }
    @keyframes pulse { 50% { opacity:.45; } }
    .actions { display:flex; gap:8px; }
    .actions button { padding:9px 13px; border:1px solid rgba(255,255,255,.4); border-radius:10px; color:#fff; background:rgba(255,255,255,.1); cursor:pointer; }
    main { width:min(1180px,calc(100% - 30px)); margin:0 auto; padding:28px 0 54px; }
    .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px; }
    .metric { position:relative; overflow:hidden; padding:22px; border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.9); box-shadow:0 10px 30px rgba(94,65,37,.08); }
    .metric::after { content:""; position:absolute; width:85px; height:85px; right:-30px; top:-30px; border-radius:50%; background:rgba(213,169,71,.14); }
    .metric span { color:var(--muted); font-size:13px; font-weight:700; }
    .metric strong { display:block; margin-top:5px; color:var(--red); font-size:clamp(26px,4vw,40px); }
    .metric time { display:block; margin-top:10px; font-size:14px; font-weight:700; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .panel { padding:22px; border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.92); box-shadow:0 10px 30px rgba(94,65,37,.07); }
    .panel h2 { display:flex; justify-content:space-between; gap:12px; margin-bottom:18px; font-family:serif; font-size:20px; }
    .panel h2 small { color:var(--muted); font-family:sans-serif; font-size:12px; font-weight:500; }
    .bar-row { display:grid; grid-template-columns:minmax(100px,1.2fr) 2fr 74px; gap:10px; align-items:center; margin:11px 0; font-size:13px; }
    .bar-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bar-track { height:12px; overflow:hidden; border-radius:99px; background:#eee4d6; }
    .bar-fill { height:100%; min-width:0; border-radius:inherit; background:linear-gradient(90deg,var(--gold),#ef8d44,var(--red)); transition:width .55s ease; }
    .bar-value { text-align:right; font-variant-numeric:tabular-nums; font-weight:800; }
    .comments { grid-column:1/-1; }
    .comment-list { display:grid; gap:10px; }
    .comment { padding:14px 16px; border-left:4px solid var(--gold); border-radius:0 12px 12px 0; background:#fff9ed; }
    .comment time { display:block; margin-bottom:5px; color:var(--muted); font-size:12px; }
    .empty { padding:26px; color:var(--muted); text-align:center; }
    .status { margin:16px 0 0; color:var(--muted); text-align:right; font-size:12px; }
    @media (max-width:720px) { .summary,.grid { grid-template-columns:1fr; } .comments { grid-column:auto; } .topbar { align-items:flex-start; } .actions { flex-direction:column; } .bar-row { grid-template-columns:105px 1fr 62px; } }
  </style>
</head>
<body>
  <section id="login-view" class="login-shell">
    <form id="login-form" class="login-card">
      <div class="crest" aria-hidden="true">鍋</div>
      <h1>運営ダッシュボード</h1>
      <p>千駄木ちゃんこ祭り 回答状況</p>
      <label for="admin-id">ID</label>
      <input id="admin-id" name="id" autocomplete="username" required>
      <label for="admin-password">パスワード</label>
      <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
      <button id="login-button" class="primary" type="submit">ログイン</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <section id="dashboard-view" class="dashboard hidden">
    <header class="topbar">
      <div><h1>千駄木ちゃんこ祭り 回答状況</h1><span class="live">5秒ごとに自動更新</span></div>
      <div class="actions"><button id="refresh-button" type="button">今すぐ更新</button><button id="logout-button" type="button">ログアウト</button></div>
    </header>
    <main>
      <section class="summary" aria-label="回答概要">
        <article class="metric"><span>総回答数</span><strong id="total-count">0</strong><time>件</time></article>
        <article class="metric"><span>本日の回答</span><strong id="today-count">0</strong><time>件</time></article>
        <article class="metric"><span>最新の回答</span><strong style="font-size:22px">最終受付</strong><time id="last-response">—</time></article>
      </section>
      <section id="chart-grid" class="grid"></section>
      <p id="sync-status" class="status" aria-live="polite"></p>
    </main>
  </section>

  <script>
    const TOKEN_KEY = 'chanko_admin_session';
    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    const loginForm = document.getElementById('login-form');
    const loginButton = document.getElementById('login-button');
    const loginError = document.getElementById('login-error');
    const chartGrid = document.getElementById('chart-grid');
    const syncStatus = document.getElementById('sync-status');
    let refreshTimer = null;
    let isLoading = false;

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      loginError.textContent = '';
      loginButton.disabled = true;
      loginButton.textContent = '確認しています…';
      google.script.run
        .withSuccessHandler((result) => {
          loginButton.disabled = false;
          loginButton.textContent = 'ログイン';
          if (!result || !result.ok) {
            loginError.textContent = result && result.message ? result.message : 'ログインできませんでした。';
            return;
          }
          sessionStorage.setItem(TOKEN_KEY, result.token);
          showDashboard();
        })
        .withFailureHandler(() => {
          loginButton.disabled = false;
          loginButton.textContent = 'ログイン';
          loginError.textContent = '通信に失敗しました。もう一度お試しください。';
        })
        .adminLogin(loginForm.elements.id.value, loginForm.elements.password.value);
    });

    document.getElementById('refresh-button').addEventListener('click', loadDashboard);
    document.getElementById('logout-button').addEventListener('click', logout);

    function showDashboard() {
      loginView.classList.add('hidden');
      dashboardView.classList.remove('hidden');
      loadDashboard();
      clearInterval(refreshTimer);
      refreshTimer = setInterval(loadDashboard, 5000);
    }

    function loadDashboard() {
      if (isLoading) return;
      const token = sessionStorage.getItem(TOKEN_KEY);
      if (!token) return showLogin();
      isLoading = true;
      syncStatus.textContent = '更新中…';
      google.script.run
        .withSuccessHandler((data) => { isLoading = false; renderDashboard(data); })
        .withFailureHandler((error) => {
          isLoading = false;
          if (String(error && error.message || error).includes('SESSION_EXPIRED')) {
            sessionStorage.removeItem(TOKEN_KEY);
            showLogin('セッションの有効期限が切れました。再度ログインしてください。');
          } else {
            syncStatus.textContent = '更新に失敗しました。自動的に再試行します。';
          }
        })
        .getDashboardData(token);
    }

    function renderDashboard(data) {
      document.getElementById('total-count').textContent = Number(data.total || 0).toLocaleString('ja-JP');
      document.getElementById('today-count').textContent = Number(data.today || 0).toLocaleString('ja-JP');
      document.getElementById('last-response').textContent = data.updatedAt || '—';
      chartGrid.replaceChildren();
      (data.questions || []).forEach((question) => chartGrid.appendChild(makeChart(question)));
      chartGrid.appendChild(makeComments(data.recentComments || []));
      syncStatus.textContent = '最終更新 ' + (data.fetchedAt || '—');
    }

    function makeChart(question) {
      const panel = document.createElement('article');
      panel.className = 'panel';
      const heading = document.createElement('h2');
      heading.append(document.createTextNode(question.title));
      const small = document.createElement('small');
      small.textContent = question.answered + '件';
      heading.appendChild(small);
      panel.appendChild(heading);
      (question.items || []).forEach((item) => {
        const row = document.createElement('div');
        row.className = 'bar-row';
        const label = document.createElement('span');
        label.className = 'bar-label';
        label.title = item.label;
        label.textContent = item.label;
        const track = document.createElement('div');
        track.className = 'bar-track';
        const fill = document.createElement('div');
        fill.className = 'bar-fill';
        fill.style.width = Math.max(0, Math.min(100, Number(item.percent || 0))) + '%';
        track.appendChild(fill);
        const value = document.createElement('span');
        value.className = 'bar-value';
        value.textContent = item.count + ' (' + item.percent + '%)';
        row.append(label, track, value);
        panel.appendChild(row);
      });
      return panel;
    }

    function makeComments(comments) {
      const panel = document.createElement('article');
      panel.className = 'panel comments';
      const heading = document.createElement('h2');
      heading.textContent = '最近のご意見・来年食べたい味や具材';
      panel.appendChild(heading);
      const list = document.createElement('div');
      list.className = 'comment-list';
      comments.forEach((item) => {
        const entry = document.createElement('div'); entry.className = 'comment';
        const time = document.createElement('time'); time.textContent = item.date;
        const text = document.createElement('div'); text.textContent = item.comment;
        entry.append(time, text); list.appendChild(entry);
      });
      if (!comments.length) { const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = '自由回答はまだありません。'; list.appendChild(empty); }
      panel.appendChild(list);
      return panel;
    }

    function logout() {
      const token = sessionStorage.getItem(TOKEN_KEY);
      sessionStorage.removeItem(TOKEN_KEY);
      if (token) google.script.run.adminLogout(token);
      showLogin();
    }

    function showLogin(message) {
      clearInterval(refreshTimer);
      dashboardView.classList.add('hidden');
      loginView.classList.remove('hidden');
      loginError.textContent = message || '';
    }

    if (sessionStorage.getItem(TOKEN_KEY)) showDashboard();
  </script>
</body>
</html>
