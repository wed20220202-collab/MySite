<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.4.4/qrcode.min.js"></script>
  <style>
    :root{color-scheme:light;--deep:#4a1118;--red:#8f1f28;--gold:#d5a947;--cream:#fff9eb;--ink:#2d2520;--muted:#756b63;--line:#eadbc2}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 0%,#fff3c9,transparent 30%),linear-gradient(135deg,#f8ead0,#fffdf8 52%,#f3e2c3)}button,input,textarea{font:inherit}.hidden{display:none!important}
    .shell{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(580px,100%);background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 60px rgba(74,17,24,.16);padding:32px}.eyebrow{color:var(--red);font-weight:800;letter-spacing:.12em}.mark{font-size:44px}h1{font-family:serif;color:var(--deep);margin:8px 0;font-size:clamp(28px,6vw,42px)}p{line-height:1.75}.grid{display:grid;gap:16px;margin-top:24px}label{display:grid;gap:7px;font-weight:700}input,textarea{width:100%;padding:13px 14px;border:1px solid #d8c9b2;border-radius:12px;background:#fff;color:var(--ink)}textarea{min-height:76px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:0;border-radius:999px;padding:14px 20px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--red),var(--deep));color:#fff;box-shadow:0 8px 20px rgba(143,31,40,.25)}.secondary{background:#f1e5d2;color:var(--deep)}.btn:disabled{opacity:.55;cursor:wait}.error{min-height:1.5em;color:#b42318;margin-top:10px;font-weight:700}.coupon{text-align:center}.coupon canvas{width:min(300px,76vw)!important;height:auto!important;border:12px solid white;border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.12)}.amount{font-family:serif;font-size:clamp(42px,10vw,72px);font-weight:900;color:var(--red);margin:8px 0}.meta{display:grid;gap:7px;background:#fff8e6;border:1px solid var(--line);padding:16px;border-radius:16px;margin:18px 0;text-align:left}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.small{font-size:13px;color:var(--muted)}
    @media(max-width:560px){.card{padding:24px 18px;border-radius:20px}.row{grid-template-columns:1fr}}
    @media print{body{background:white}.shell{padding:0}.card{box-shadow:none;border:0}.no-print{display:none!important}}
  </style>
</head>
<body>
  <section id="loginView" class="shell">
    <div class="card">
      <div class="mark">🍲</div><div class="eyebrow">販売スタッフ専用</div><h1>クーポン発行</h1><p>ちゃんこ購入者へ渡す、一回限りの割引QRを発行します。</p>
      <form id="loginForm" class="grid">
        <label>ID<input id="loginId" autocomplete="username" required></label>
        <label>パスワード<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button id="loginButton" class="btn primary" type="submit">ログイン</button>
      </form><div id="loginError" class="error" role="alert"></div>
    </div>
  </section>
  <section id="issueView" class="shell hidden">
    <div class="card">
      <div class="eyebrow">千駄木ちゃんこ祭り</div><h1>クーポンを発行</h1><p class="no-print">金額と有効期限を確認し、購入者1名につき1回発行してください。</p>
      <form id="issueForm" class="grid no-print">
        <div class="row"><label>割引額（円）<input id="amount" type="number" min="1" max="5000" step="1" value="100" required></label><label>有効期限<input id="expiresOn" type="date" required></label></div>
        <label>備考（任意）<textarea id="note" maxlength="200" placeholder="例：ちゃんこ購入特典"></textarea></label>
        <button id="issueButton" class="btn primary" type="submit">この内容でQRを発行</button>
      </form><div id="issueError" class="error no-print" role="alert"></div>
      <div id="couponView" class="coupon hidden">
        <div class="small">購入特典クーポン</div><div id="couponAmount" class="amount"></div><canvas id="qrCanvas" aria-label="クーポンQRコード"></canvas>
        <div class="meta"><div><b>クーポンID：</b><span id="couponId"></span></div><div><b>有効期限：</b><span id="couponExpiry"></span></div><div class="small">1回限り有効。店舗で使用済み処理を行うと再利用できません。</div></div>
        <div class="actions no-print"><button id="downloadButton" class="btn primary" type="button">QR画像を保存</button><button onclick="window.print()" class="btn secondary" type="button">印刷</button><button id="nextButton" class="btn secondary" type="button">次のクーポン</button></div>
      </div>
    </div>
  </section>
  <script>
    const $=id=>document.getElementById(id);let sessionToken='';let currentCoupon=null;
    const defaultExpiry=new Date();defaultExpiry.setDate(defaultExpiry.getDate()+30);$('expiresOn').value=defaultExpiry.toISOString().slice(0,10);
    $('loginForm').addEventListener('submit',e=>{e.preventDefault();const b=$('loginButton');b.disabled=true;b.textContent='確認しています…';$('loginError').textContent='';google.script.run.withSuccessHandler(result=>{b.disabled=false;b.textContent='ログイン';if(!result.ok){$('loginError').textContent=result.message;return}sessionToken=result.token;$('loginView').classList.add('hidden');$('issueView').classList.remove('hidden')}).withFailureHandler(err=>{b.disabled=false;b.textContent='ログイン';$('loginError').textContent=err.message||'ログインできませんでした。'}).adminLogin($('loginId').value,$('loginPassword').value)});
    $('issueForm').addEventListener('submit',e=>{e.preventDefault();const b=$('issueButton');b.disabled=true;b.textContent='発行しています…';$('issueError').textContent='';google.script.run.withSuccessHandler(showCoupon).withFailureHandler(err=>{b.disabled=false;b.textContent='この内容でQRを発行';$('issueError').textContent=err.message||'発行できませんでした。'}).issueCoupon(sessionToken,{amount:Number($('amount').value),expiresOn:$('expiresOn').value,note:$('note').value})});
    function showCoupon(result){currentCoupon=result;$('issueButton').disabled=false;$('issueButton').textContent='この内容でQRを発行';$('issueForm').classList.add('hidden');$('couponView').classList.remove('hidden');$('couponAmount').textContent=result.amount.toLocaleString('ja-JP')+'円引き';$('couponId').textContent=result.couponId;$('couponExpiry').textContent=result.expiresOn;QRCode.toCanvas($('qrCanvas'),result.redeemUrl,{width:360,margin:2,errorCorrectionLevel:'H'},err=>{if(err)$('issueError').textContent='QR画像を作成できませんでした。URLを再読み込みしてください。'})}
    $('downloadButton').addEventListener('click',()=>{if(!currentCoupon)return;const a=document.createElement('a');a.download=currentCoupon.couponId+'.png';a.href=$('qrCanvas').toDataURL('image/png');a.click()});
    $('nextButton').addEventListener('click',()=>{currentCoupon=null;$('couponView').classList.add('hidden');$('issueForm').classList.remove('hidden');$('note').value='';$('issueError').textContent=''});
  </script>
</body>
</html>
