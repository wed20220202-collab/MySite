<!doctype html>
<html lang="ja">
<head>
  <base target="_top"><meta charset="utf-8">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root{color-scheme:light;--deep:#4a1118;--red:#8f1f28;--green:#176b46;--cream:#fff9eb;--ink:#2d2520;--muted:#756b63;--line:#eadbc2}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 0%,#fff3c9,transparent 30%),linear-gradient(135deg,#f8ead0,#fffdf8 52%,#f3e2c3)}button,input{font:inherit}.hidden{display:none!important}.shell{min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(650px,100%);background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 60px rgba(74,17,24,.16);padding:30px}.eyebrow{color:var(--red);font-weight:800;letter-spacing:.12em}h1{font-family:serif;color:var(--deep);margin:8px 0;font-size:clamp(28px,6vw,42px)}p{line-height:1.7}.grid{display:grid;gap:15px;margin-top:20px}label{display:grid;gap:7px;font-weight:700}input{width:100%;padding:13px 14px;border:1px solid #d8c9b2;border-radius:12px}.btn{border:0;border-radius:999px;padding:14px 20px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--red),var(--deep));color:#fff}.success{background:linear-gradient(135deg,#25825b,var(--green));color:#fff}.secondary{background:#f1e5d2;color:var(--deep)}.btn:disabled{opacity:.55;cursor:wait}.error{min-height:1.5em;color:#b42318;margin-top:10px;font-weight:700}#reader{margin:18px 0;border-radius:18px;overflow:hidden}.manual{display:flex;gap:9px}.manual input{flex:1}.result{margin-top:20px;padding:22px;border:2px solid var(--line);border-radius:20px;text-align:center;background:#fff}.result.available{border-color:#79bd9a;background:#f0fff7}.result.used,.result.expired{border-color:#e6a09a;background:#fff5f4}.amount{font-family:serif;font-size:clamp(40px,10vw,68px);font-weight:900;color:var(--red);margin:8px 0}.status{font-size:22px;font-weight:900}.meta{color:var(--muted);line-height:1.8}.redeem{width:100%;margin-top:18px;font-size:20px}.notice{font-weight:800;color:var(--red)}@media(max-width:560px){.card{padding:22px 16px}.manual{display:grid}}
  </style>
</head>
<body>
  <section id="loginView" class="shell"><div class="card"><div class="eyebrow">加盟店スタッフ専用</div><h1>クーポン確認</h1><p>使用済み処理は取り消せません。会計時にお客様のQRを読み取ってください。</p><form id="loginForm" class="grid"><label>ID<input id="loginId" autocomplete="username" required></label><label>パスワード<input id="loginPassword" type="password" autocomplete="current-password" required></label><label>店舗名<input id="storeName" maxlength="80" placeholder="例：千駄木○○商店" required></label><button id="loginButton" class="btn primary" type="submit">ログインして読み取る</button></form><div id="loginError" class="error" role="alert"></div></div></section>
  <section id="scanView" class="shell hidden"><div class="card"><div class="eyebrow">千駄木ちゃんこ祭り</div><h1>クーポンを読み取る</h1><p id="storeLabel"></p><div id="reader"></div><div class="manual"><input id="manualCode" placeholder="QRのURLまたはコードを入力"><button id="checkButton" class="btn secondary" type="button">確認</button></div><div id="scanError" class="error" role="alert"></div><div id="result" class="result hidden"><div id="status" class="status"></div><div id="amount" class="amount"></div><div id="message"></div><div id="meta" class="meta"></div><button id="redeemButton" class="btn success redeem hidden" type="button">このクーポンを使用済みにする</button></div></div></section>
  <script>
    const $=id=>document.getElementById(id);let sessionToken='';let storeName='';let activeToken='';let scanner=null;let queryToken='';
    google.script.url.getLocation(locationInfo=>{queryToken=(locationInfo.parameter&&locationInfo.parameter.c)||''});
    $('loginForm').addEventListener('submit',e=>{e.preventDefault();const b=$('loginButton');b.disabled=true;b.textContent='確認しています…';$('loginError').textContent='';google.script.run.withSuccessHandler(result=>{b.disabled=false;b.textContent='ログインして読み取る';if(!result.ok){$('loginError').textContent=result.message;return}sessionToken=result.token;storeName=$('storeName').value.trim();$('storeLabel').textContent='利用店舗：'+storeName;$('loginView').classList.add('hidden');$('scanView').classList.remove('hidden');if(queryToken)checkCoupon(queryToken);else startScanner()}).withFailureHandler(err=>{b.disabled=false;b.textContent='ログインして読み取る';$('loginError').textContent=err.message||'ログインできませんでした。'}).adminLogin($('loginId').value,$('loginPassword').value)});
    function startScanner(){try{scanner=new Html5QrcodeScanner('reader',{fps:10,qrbox:{width:240,height:240},rememberLastUsedCamera:true},false);scanner.render(text=>{if(scanner)scanner.pause(true);checkCoupon(text)},()=>{})}catch(e){$('scanError').textContent='カメラを開始できません。下の入力欄からQRのURLを入力してください。'}}
    $('checkButton').addEventListener('click',()=>checkCoupon($('manualCode').value));
    function extractToken(value){const text=String(value||'').trim();try{const url=new URL(text);return url.searchParams.get('c')||text}catch(e){return text}}
    function checkCoupon(value){const token=extractToken(value);if(!token)return;$('scanError').textContent='';$('result').classList.add('hidden');google.script.run.withSuccessHandler(result=>showResult(result,token)).withFailureHandler(err=>{$('scanError').textContent=err.message||'クーポンを確認できませんでした。';if(scanner)scanner.resume()}).lookupCoupon(token)}
    function showResult(data,token){activeToken=token;$('result').className='result '+String(data.status||'').toLowerCase();$('result').classList.remove('hidden');$('status').textContent=data.status==='AVAILABLE'?'利用できます':data.status==='USED'?'使用済み':data.status==='EXPIRED'?'期限切れ':'利用できません';$('amount').textContent=data.amount?data.amount.toLocaleString('ja-JP')+'円引き':'';$('message').textContent=data.message||'';$('meta').textContent=(data.couponId?'ID：'+data.couponId+'　':'')+(data.expiresAt?'有効期限：'+data.expiresAt:'')+(data.redeemedAt?'　利用日時：'+data.redeemedAt:'');$('redeemButton').classList.toggle('hidden',!data.ok);if(!data.ok&&scanner)setTimeout(()=>scanner.resume(),1500)}
    $('redeemButton').addEventListener('click',()=>{if(!activeToken)return;if(!confirm('この操作は取り消せません。会計で割引を適用しましたか？'))return;const b=$('redeemButton');b.disabled=true;b.textContent='使用済みにしています…';google.script.run.withSuccessHandler(result=>{b.disabled=false;b.textContent='このクーポンを使用済みにする';showResult(result,activeToken);if(result.ok){$('status').textContent='使用済みにしました';b.classList.add('hidden');setTimeout(()=>{if(scanner)scanner.resume()},1800)}}).withFailureHandler(err=>{b.disabled=false;b.textContent='このクーポンを使用済みにする';$('scanError').textContent=err.message||'処理できませんでした。'}).redeemCoupon(sessionToken,activeToken,storeName)});
  </script>
</body>
</html>
